spring.application.name=clinical-assistant
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT:8081}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=clinical-assistant
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.async-acks=true
assistant.kafka.topic=triaje.eventos
spring.ai.google.genai.api-key=${LLM_API_KEY:}
spring.ai.google.genai.chat.options.model=${LLM_MODEL:gemini-3.8-flash}
spring.ai.google.genai.embedding.api-key=${LLM_API_KEY:}
spring.ai.google.genai.embedding.text.options.model=${EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.options.task-type=SEMANTIC_SIMILARITY
spring.ai.google.genai.embedding.text.options.dimensions=768
spring.ai.vectorstore.redis.initialize-schema=false
spring.ai.vectorstore.redis.index-name=clinical-protocols
spring.ai.vectorstore.redis.prefix=clinical-protocol:
assistant.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.82}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
management.health.kafka.enabled=true
security.api-key=${API_KEY}
