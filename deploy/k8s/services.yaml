apiVersion: v1
kind: ConfigMap
metadata:
  name: vidacruz-config
data:
  R2DBC_URL: "r2dbc:postgresql://postgres.example.internal:5432/triage"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.example.internal:9092"
  REDIS_HOST: "redis.example.internal"
  REDIS_PORT: "6379"
  TRIAGE_SCHEDULER_DELAY_MS: "10000"
  LLM_MODEL: "gemini-3.8-flash"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage
  template:
    metadata:
      labels:
        app: triage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: triage
          image: YOUR_ACR.azurecr.io/triage-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: api-key
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: db-password
          envFrom:
            - configMapRef:
                name: vidacruz-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: triage
spec:
  selector:
    app: triage
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assistant
  template:
    metadata:
      labels:
        app: assistant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: assistant
          image: YOUR_ACR.azurecr.io/assistant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: api-key
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vidacruz-secrets
                  key: llm-api-key
          envFrom:
            - configMapRef:
                name: vidacruz-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: assistant
spec:
  selector:
    app: assistant
  ports:
    - name: http
      port: 80
      targetPort: http
