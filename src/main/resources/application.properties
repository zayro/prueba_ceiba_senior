spring.application.name=ceiba
server.port=${SERVER_PORT:8080}
spring.r2dbc.url=${R2DBC_URL:r2dbc:postgresql://localhost:5432/triage}
spring.r2dbc.username=${DB_USER:ceiba}
spring.r2dbc.password=${DB_PASSWORD:ceiba}
spring.sql.init.mode=always
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.r2dbc.enabled=true
management.health.kafka.enabled=true
security.api-key=${API_KEY}
triage.kafka.topic=triaje.eventos
triage.scheduler.fixed-delay-ms=${TRIAGE_SCHEDULER_DELAY_MS:10000}
triage.outbox.poll-interval-ms=${TRIAGE_OUTBOX_POLL_MS:500}
triage.sla.critico-minutes=${TRIAGE_SLA_CRITICO_MINUTES:5}
triage.sla.urgente-minutes=${TRIAGE_SLA_URGENTE_MINUTES:10}
triage.sla.urgente-2-minutes=${TRIAGE_SLA_URGENTE_2_MINUTES:30}
triage.sla.no-urgente-minutes=${TRIAGE_SLA_NO_URGENTE_MINUTES:60}
triage.sla.no-urgente-2-minutes=${TRIAGE_SLA_NO_URGENTE_2_MINUTES:120}
